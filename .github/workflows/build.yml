name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  merge_group:
    types: [checks_requested]
  pull_request:
  # Upstream only validates pull requests; this fork pushes to main directly, so main needs its own
  # verification rather than being merged unverified. Documentation cannot break a build, and six
  # platforms of it costs about an hour of runner time.
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_call:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug
      environment:
        description: Deployment environment to run under
        type: string
  workflow_dispatch:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug

permissions: {}

jobs:
  # The matrix is produced here rather than written out in the build job so that a push to main can
  # ask for fewer targets: one per toolchain is enough to catch a compile error, while pull requests
  # and tags - the latter being what produces the artifacts we ship - still build all six.
  pick-matrix:
    runs-on: ubuntu-slim
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - name: Pick the platforms to build
        id: pick
        shell: bash
        env:
          MATRIX: |
            [
              {"os":"ubuntu-24.04","artifact-name":"Linux","cmake-preset":"linux","qt-version":"6.11.2","on-main":true},
              {"os":"ubuntu-24.04-arm","artifact-name":"Linux-aarch64","cmake-preset":"linux","qt-version":"6.11.2"},
              {"os":"windows-2022","artifact-name":"Windows-MinGW-w64","cmake-preset":"windows_mingw","msystem":"CLANG64","vcvars-arch":"amd64_x86","qt-version":"6.11.2"},
              {"os":"windows-2022","artifact-name":"Windows-MSVC","cmake-preset":"windows_msvc","vcvars-arch":"amd64","qt-version":"6.11.2","on-main":true},
              {"os":"windows-11-arm","artifact-name":"Windows-MSVC-arm64","cmake-preset":"windows_msvc","vcvars-arch":"arm64","qt-version":"6.11.2"},
              {"os":"macos-26","artifact-name":"macOS","cmake-preset":"macos_universal","macosx-deployment-target":"13.0","qt-version":"6.11.2","on-main":true}
            ]
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "branch" ]; then
            echo "include=$(printf '%s' "$MATRIX" | jq -c '[.[] | select(."on-main")]')" >> "$GITHUB_OUTPUT"
          else
            echo "include=$(printf '%s' "$MATRIX" | jq -c .)" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.artifact-name }})

    needs: pick-matrix

    environment: ${{ inputs.environment || '' }}

    permissions:
      contents: read
      # Required for Azure Trusted Signing
      id-token: write
      # Required for vcpkg binary cache
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pick-matrix.outputs.include) }}

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: ${{ matrix.msystem != '' && 'msys2 {0}' || 'bash' }}

    env:
      ARTIFACT_NAME: ${{ matrix.artifact-name }}-Qt6
      BUILD_PLATFORM: official
      BUILD_TYPE: ${{ inputs.build-type || 'Debug' }}
      CMAKE_PRESET: ${{ matrix.cmake-preset }}

      # Empty on forks, which is what keeps the CurseForge pages hidden - the launcher treats a missing key as
      # "this platform is not available here" rather than as a broken feature.
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx-deployment-target }}

      # Without this sccache refuses every compile of the universal macOS build (multiple -arch flags).
      SCCACHE_CACHE_MULTIARCH: 1

    steps:
      ##
      # SETUP
      ##

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: ${{ matrix.artifact-name }}
          msystem: ${{ matrix.msystem }}
          vcvars-arch: ${{ matrix.vcvars-arch }}
          qt-version: ${{ matrix.qt-version }}

      ##
      # BUILD
      ##

      - name: Configure project
        env:
          # The universal build's PCH commands collide with sccache's multi-arch rewrite.
          DISABLE_PCH: ${{ runner.os == 'macOS' && 'ON' || 'OFF' }}
        run: |
          cmake --preset "$CMAKE_PRESET" -D VCPKG_HOST_TRIPLET="$VCPKG_TRIPLET" -D VCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET" \
            -D Launcher_CURSEFORGE_API_KEY="$CURSEFORGE_API_KEY" -D CMAKE_DISABLE_PRECOMPILE_HEADERS="$DISABLE_PCH"

      - name: Run build
        run: |
          cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE"

      # Not a gate: this only reports whether the compiler cache paid for itself.
      - name: Compiler cache stats
        if: ${{ !cancelled() }}
        shell: bash
        run: sccache --show-stats || ccache --show-stats || true

      - name: Run tests
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          ctest --preset "$CMAKE_PRESET" --build-config "$BUILD_TYPE"

      ##
      # PACKAGE
      ##

      - name: Get short version
        id: short-version
        shell: bash
        run: |
          echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package (Linux)
        if: ${{ runner.os == 'Linux' }}
        uses: ./.github/actions/package/linux
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}
          qt-version: ${{ steps.setup-dependencies.outputs.qt-version }}

          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-private-key-id: ${{ secrets.GPG_PRIVATE_KEY_ID }}

      - name: Package (macOS)
        if: ${{ runner.os == 'macOS' }}
        uses: ./.github/actions/package/macos
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}

          apple-codesign-cert: ${{ secrets.APPLE_CODESIGN_CERT }}
          apple-codesign-password: ${{ secrets.APPLE_CODESIGN_PASSWORD }}
          apple-codesign-id: ${{ secrets.APPLE_CODESIGN_ID }}
          apple-notarize-apple-id: ${{ secrets.APPLE_NOTARIZE_APPLE_ID }}
          apple-notarize-team-id: ${{ secrets.APPLE_NOTARIZE_TEAM_ID }}
          apple-notarize-password: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
          sparkle-ed25519-key: ${{ secrets.SPARKLE_ED25519_KEY }}

      - name: Package (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: ./.github/actions/package/windows
        env:
          CI_HAS_ACCESS_TO_AZURE: ${{ vars.CI_HAS_ACCESS_TO_AZURE || '' }}
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}
          msystem: ${{ matrix.msystem }}

          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
