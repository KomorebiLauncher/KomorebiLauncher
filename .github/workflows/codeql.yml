name: "CodeQL Code Scanning"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  merge_group:
    types: [checks_requested]
  pull_request:
    # Scanning markdown and docs is wasted time; the code is what gets analysed.
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions: {}

jobs:
  CodeQL:
    runs-on: ubuntu-latest

    # Skip drafts and explicitly skipped pull requests; the analysis only means something for code.
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        (!github.event.pull_request.draft &&
         !contains(github.event.pull_request.labels.*.name, 'skip-ci'))
      }}

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: "true"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-and-quality
          languages: cpp, java

      - name: Setup dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: Debug
          qt-version: 6.8.3

      # libraries/launcher is compiled with -source 7, which a JDK newer than 17 refuses. CodeQL
      # brings its own runtime for the Java extractor, so pin the JDK the build itself needs.
      - name: Select JDK 17 for the Java parts
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17

      - name: Configure and Build
        run: |
          cmake --preset linux -DLauncher_USE_PCH=OFF
          cmake --build --preset linux --config Debug

      - name: Run tests
        run: |
          ctest --preset linux --build-config Debug --extra-verbose --output-on-failure

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
